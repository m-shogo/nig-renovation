<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# 仮想ホストに書き、各ディレクトリの .htaccess より先に評価させる
	RewriteEngine On

	RewriteRule ^/$ /nig/ [R=302,L]

	# ローカルに無い uploads だけを外部から表示する(.wpress にメディアが含まれないため)
	# images・pdf などは nig/ に置いたものだけを表示する(検証サーバーは参照しない)
	RewriteCond %{LA-U:REQUEST_FILENAME} !-f
	RewriteRule ^/nig/(wp-content/uploads/.+)$ ${UPLOADS_FALLBACK_URL}/nig/$1 [R=302,L]
</VirtualHost>
