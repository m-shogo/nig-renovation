<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# 仮想ホストに書き、各ディレクトリの .htaccess より先に評価させる
	RewriteEngine On

	RewriteRule ^/$ /nig/ [R=302,L]

	# ローカルに無いファイルだけを外部から表示する(Git・.wpress に含まれないもの)
	# uploads は検証サーバーと同じく本番を参照する
	RewriteCond %{LA-U:REQUEST_FILENAME} !-f
	RewriteRule ^/nig/(wp-content/uploads/.+)$ ${UPLOADS_FALLBACK_URL}/nig/$1 [R=302,L]

	RewriteCond %{LA-U:REQUEST_FILENAME} !-f
	RewriteRule ^/nig/((images|pdf|download|ja-ja|bk)/.+|[^/]+\.(ico|png))$ ${STATIC_FALLBACK_URL}/nig/$1 [R=302,L]
</VirtualHost>
