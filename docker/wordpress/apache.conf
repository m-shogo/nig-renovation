<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# 仮想ホストに書き、各ディレクトリの .htaccess より先に評価させる
	RewriteEngine On

	RewriteRule ^/$ /nig/ [R=302,L]

	# ローカルに無い uploads は本番へ転送しない。実ファイルが無いパスは 404。
	# images・pdf なども nig/ に置いたものだけを表示する。
</VirtualHost>
